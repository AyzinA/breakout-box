# =============================================================================
# Breakout Box - default configuration
# Version: 1.0.2
# =============================================================================
#
# On first boot this file is copied to:
#   /data/adb/breakout-box/config.conf
#
# Edit the persistent config above for per-device settings. Updating the Magisk
# module does NOT overwrite that persistent file.
# =============================================================================

# -----------------------------------------------------------------------------
# Breakout routing
# -----------------------------------------------------------------------------

# OpenVPN tunnel interface created by OpenVPN Connect.
VPN_INTERFACE="tun0"

# OpenVPN network whose clients are forwarded through this Android box.
VPN_NETWORK="10.8.0.0/24"

# Policy-routing table numbers.
VPN_TABLE="100"
WAN_TABLE="101"

# Policy-routing rule priorities.
VPN_TO_CLIENT_PRIORITY="9000"
VPN_FROM_CLIENT_PRIORITY="9001"
VPN_IIF_PRIORITY="9002"

# -----------------------------------------------------------------------------
# Self-healing / monitoring
# -----------------------------------------------------------------------------

# Fast state polling for WAN, gateway and tun changes.
CHECK_INTERVAL_SECONDS="3"

# Full routing/firewall health verification interval.
HEALTH_CHECK_INTERVAL_SECONDS="15"

# Delay before supervisor restarts a failed routing worker.
SERVICE_RESTART_DELAY_SECONDS="3"

# Restart the worker after this many consecutive repair failures.
MAX_REPAIR_FAILURES="3"

# -----------------------------------------------------------------------------
# ADB over TCP
# -----------------------------------------------------------------------------

# true = enable classic ADB TCP after boot; false = leave adbd unchanged.
ENABLE_ADB_TCP=true
ADB_TCP_PORT="5555"

# -----------------------------------------------------------------------------
# Firewall chains
# -----------------------------------------------------------------------------

# Dedicated chain names owned by Breakout Box.
FILTER_CHAIN="BB_FORWARD"
NAT_CHAIN="BB_NAT"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------

LOG_TAG="breakout-box"


# -----------------------------------------------------------------------------
# File logging / rotation
# -----------------------------------------------------------------------------
LOG_LEVEL="info"
MAX_LOG_SIZE=1048576
MAX_LOG_FILES=3

# -----------------------------------------------------------------------------
# Universal automatic updater
# -----------------------------------------------------------------------------
AUTO_UPDATE=false
UPDATE_CHECK_INTERVAL_SECONDS=86400
UPDATE_INITIAL_DELAY_SECONDS=120
UPDATE_JSON_URL="https://raw.githubusercontent.com/ayzina/breakout-box/main/breakout-box/update.json"
UPDATE_REQUIRE_SHA256=true
UPDATE_INSTALL_ONLY_ON_WIFI=false
UPDATE_KEEP_DOWNLOADED_ZIP=false
